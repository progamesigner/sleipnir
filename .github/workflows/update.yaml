name: Update Sleipnir versions

on:
  schedule:
  - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: update-sleipnir-versions
  cancel-in-progress: false

jobs:
  update:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: main
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.14'
    - id: versions
      env:
        GH_TOKEN: ${{ github.token }}
        PR_BODY_PATH: ${{ runner.temp }}/versions.md
      run: python3 .github/scripts/update.py
    - id: pr
      if: steps.versions.outputs.changed == 'true'
      uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
      with:
        token: ${{ github.token }}
        sign-commits: true
        add-paths: versions
        branch: automation/update-versions
        base: main
        commit-message: Update tool versions
        title: ${{ steps.versions.outputs.title }}
        body-path: ${{ runner.temp }}/versions.md
    - if: steps.pr.outputs.pull-request-number
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh pr merge "${{ steps.pr.outputs.pull-request-number }}" --repo "${{ github.repository }}" --squash --delete-branch
