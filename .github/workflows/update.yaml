name: Update Sleipnir versions

on:
  schedule:
  - cron: '0 1 * * *'
  workflow_dispatch:

concurrency:
  group: update-sleipnir-versions
  cancel-in-progress: false

jobs:
  update:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: main
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.14'
    - id: versions
      env:
        GH_TOKEN: ${{ github.token }}
        PR_BODY_PATH: ${{ runner.temp }}/versions.md
      run: python3 .github/scripts/update.py
    - if: steps.versions.outputs.changed == 'true'
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        token: ${{ github.token }}
        sign-commits: true
        add-paths: versions
        branch: automation/update-versions
        base: main
        commit-message: Update tool versions
        title: ${{ steps.versions.outputs.title }}
        body-path: ${{ runner.temp }}/versions.md
